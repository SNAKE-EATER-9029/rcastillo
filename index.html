<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="./wwwroot/css/bootstrap.min.css" rel="stylesheet">
    <link href="./wwwroot/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="./wwwroot/css/bootstrap-icons.min.css">
    <script src="./wwwroot/js/jquery-4.0.0.min.js"></script>
    <script src="./wwwroot/js/script.js"></script>
  </head>
  <body>
    <main id="main">
      <div class="container-lg d-flex flex-column">
        <div class="row align-items-center justify-content-center no-gutters">
          <div class="col-md-7 col-lg-5">
            <div class="shadow mt-5 p-5 login-box-transparente">
              <div class="w-100 text-center">
                <h1 class="display-6"> Iniciar sesión</h1>
                <p class="text-muted">Use sus credenciales para iniciar sesión</p>
              </div>
              
              <div class="col-12">
                <!-- CAMBIO 1: Agregamos la etiqueta FORM con el destino y el método -->
                <form action="login.php" method="POST">

                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <!-- CAMBIO 2: Agregamos name="email" para que PHP lo reconozca -->
                    <input class="form-control" id="email" name="email" required>
                  </div>

                  <div class="mb-3">
                    <label for="pwd" class="form-label">Contraseña</label>
                    <!-- CAMBIO 3: Agregamos name="pwd" para que PHP lo reconozca -->
                    <input class="form-control" type="password" id="pwd" name="pwd" required>
                  </div>

                  <div class="d-flex justify-content-between py-3">
                    <div>
                      <span class="small text-muted">¿No tienes cuenta?</span>
                      <a class="small" href="registro.html"> Crear cuenta</a>
                    </div>
                    <!-- CAMBIO 4: Cambiamos onclick por type="submit" para activar el formulario -->
                    <button type="submit" class="btn btn-outline-primary"> Iniciar sesión</button>
                  </div>

                </form> <!-- CAMBIO 5: Cerramos la etiqueta FORM -->
              </div>  
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
